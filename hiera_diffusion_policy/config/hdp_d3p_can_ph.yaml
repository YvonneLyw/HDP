_target_: hiera_diffusion_policy.workspace.train_workspace.TrainWorkspace

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  # not use
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 0
    mode: max
    monitor_key: test_mean_score

dataloader:
  batch_size: 256
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: true

dataloader_noshuff:
  batch_size: 256
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: false

guider_path:
critic_path:
actor_path: 

train_model: actor  # [guider, critic, actor]

name_remark: allDemo

logging:
  group: null
  id: null
  mode: online
  name: can_ph_seed${training.seed}_${name_remark}
  project: hiera_diffusion_policy
  resume: false

test_guider: false
test_run: false

max_train_episodes: null
use_subgoal: true
use_pcd: true # 只限制actor
use_image: true                #########################新增############
single_step_reverse_diffusion: true
eta: 0.001
subgoal_dim: 8
subgoal_dim_nocont: 6
extra_cond_dim: 64   #########################新增############

n_action_steps: 4 ##原版8###############################！！！
horizon: 16
Tr: 8
n_latency_steps: 0
observation_history_num: 2
name: train_hdp_d3p_fusion

optimizer_guider:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-06

optimizer_critic:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-06

optimizer_actor:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06


model_guider:
  _target_: hiera_diffusion_policy.model.diffusion.guider.Guider
  diffusion_step_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.positional_embedding.TimestepEncoder
    diffusion_step_embed_dim: 128
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
    - 256
  state_dim: 54
  subgoal_dim: ${subgoal_dim}
  mlp_dims: 
  - 1024
  - 512
  - 256


model_actor:
  _target_: hiera_diffusion_policy.model.diffusion.actor_small.Actor
  diffusion_step_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.positional_embedding.TimestepEncoder
    diffusion_step_embed_dim: 128
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
  action_dim: 10
  down_dims:
  - 128
  - 256
  - 512
  state_dim: 54
  use_subgoal: ${use_subgoal}
  use_pcd: ${use_pcd}
  subgoal_dim: ${subgoal_dim}
  extra_cond_dim: ${extra_cond_dim}  #########################新增############
  kernel_size: 5
  n_groups: 8 # group normal param
  cond_predict_scale: true


model_critic:
  _target_: hiera_diffusion_policy.model.diffusion.critic.Critic2net
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
    - 256
  state_dim: 54
  subgoal_dim: ${subgoal_dim}
  action_dim: 80  # 10*Tr
  mlp_dims:
  - 512
  - 256
  - 128


policy:
  _target_: hiera_diffusion_policy.policy.hiera_diffusion_policy_d3p_fusion.HieraDiffusionPolicyD3PFusion
  fusion_debug_checks: true
  d3p_query_every: ${task.dataset.d3p_query_every}
  #########################新增############一直到
  mode: SWITCH             # SINGLE / SWITCH
  single_branch: A        # A / B1 / B2 (mode=SINGLE 时训练和rollout都用这个分支)
  b_branch: B2            # B1 / B2 (mode=SWITCH 时与A做训练切换和rollout选择)
  switch_prob_b: 0.5      # mode=SWITCH 时训练阶段采样 B 分支概率
  b_branch_use_q_loss: false   # 是否让B分支也参与Q-loss
  branch_selector: doser_gt    # err / q / hybrid_gate / hybrid_linear / doser / doser_gt
  use_action_smoothing: false
  use_test_time_aggregation: false  # branch_selector=doser 的第一版建议改成 false
  test_time_agg_beta: 0.97
  test_time_agg_tau: 0.1
  doser_selector:
    # Preferred: checkpoint produced by HDP/pretrain_doser_selector_components.py.
    components_path: outputs/doser_selector_components/doser_selector_components_pcd_staged_demo50.ckpt
    action_ood_percentile: 0.98
    state_ood_percentile: 0.98
    q_margin: 0.05
    v_margin: 0.05
    fallback_when_both_ood: A
    require_dynamics_uncertainty: false
    dynamics_uncertainty_threshold: 1000000000.0
  # Parallel ground-truth-state version. Enable with branch_selector=doser_gt.
  doser_gt_selector:
    components_path: outputs/doser_selector_components/doser_selector_components_gt_split_demo50.ckpt
    action_ood_percentile: 0.98
    state_ood_percentile: 0.98
    q_margin: 0.05
    v_margin: 0.05
    fallback_when_both_ood: A
    require_dynamics_uncertainty: false
    dynamics_uncertainty_threshold: 1000000000.0
  doser_critic_refresh:
    enabled: true
    start_epoch: 100
    every: 100
    max_batches: null     # null = one full train_loader epoch
    bellman_weight: 1.0
    low_weight: 0.1
    rank_weight: 0.1
    q_low: 0.0
    rank_margin: 0.05
    value_sync_enabled: true
    value_sync_weight: 1.0
    value_lr: 0.0001
    value_weight_decay: 0.000001
    value_expectile: 0.7
  d3p_rollout_error_samples: 10
  use_koopman_aux: true  # B分支是否叠加DKO辅助loss（koop_consis_kvp / koop_consis_fea）
  extra_cond_dim: ${extra_cond_dim}  
  image_feat_dim: 64
  qpos_feat_dim: 9                     #########################新增############
  next_action_mode: dataset  #! dataset/pred_local/pred_global  ##pred_local： 使用actor预测next_action ##dataset模式：解偶
  action_dim: 10
  horizon: ${horizon}
  subgoal_dim_nocont: ${subgoal_dim_nocont}
  subgoal_dim: ${subgoal_dim}
  n_action_steps: ${n_action_steps}
  observation_history_num: 2
  discount: 0.95  #! 0.95/0.99
  eta: ${eta}  # actor loss权重系数
  use_pcd: ${use_pcd}
  single_step_reverse_diffusion: ${single_step_reverse_diffusion}
  Tr: ${Tr}
  ema:
    _target_: hiera_diffusion_policy.model.diffusion.ema_model_hdp.EMAModel
    inv_gamma: 1.0
    max_value: 0.9999
    min_value: 0.0
    power: 0.75
    update_after_step: 0
  noise_scheduler_guider:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_schedule: squaredcos_cap_v2
    beta_end: 0.02
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100 #!   ##iffusion timestep（0～100）
    prediction_type: epsilon
    variance_type: fixed_small
  noise_scheduler_actor:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_schedule: squaredcos_cap_v2
    beta_end: 0.02
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 10 #!
    prediction_type: epsilon
    variance_type: fixed_small


task:
  abs_action: true
  action_dim: 10
  dataset:
    _target_: hiera_diffusion_policy.dataset.robomimic_replay_dataset.RobomimicReplayDataset
    max_train_episodes: ${max_train_episodes} #! 默认null(200)
    Tr: ${Tr}
    use_subgoal: ${use_subgoal}
    observation_history_num: ${observation_history_num}
    abs_action: true
    dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5 ###############################一直到
    use_image: ${use_image}
    image_keys:
    - agentview_image
    - robot0_eye_in_hand_image
    image_size:
    - 84
    - 84
    d3p_query_every: 4  # D3P query interval; avoid directly using Tr=8 at this stage##########################
    d3p_action_chunk_len: ${horizon} ##Actor 训练用整段 horizon（用的sequence_length），推理执行时才截成 n_action_steps
    qpos_normalize: true
    horizon: ${horizon}
    obs_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    val_ratio: 0.02
  dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5 #########################
  dataset_type: ph
  env_runner:
    _target_: hiera_diffusion_policy.env_runner.robomimic_runner.RobomimicRunner
    abs_action: true
    crf: 22
    dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5 #########################
    fps: 10
    max_steps: 500
    use_subgoal: ${use_subgoal}
    use_pcd: ${use_pcd}
    image_keys: #############################################################################3
    - agentview_image
    - robot0_eye_in_hand_image
    qpos_normalize: ${task.dataset.qpos_normalize}
    n_action_steps: ${n_action_steps}
    n_envs: 28
    n_latency_steps: 0
    observation_history_num: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    obs_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    past_action: false
    render_hw:
    - 128
    - 128
    test_start_seed: 100000
    train_start_idx: 0
    test_run: ${test_run}
  name: can_pcd
  obs_keys:
  - object
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
  task_name: can

training:
  checkpoint_every: 50
  debug: false
  visual_data: true
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3000
  num_steps: 300000 #!
  resume: true
  rollout_every: 50
  updateAction_every: 10
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1

val_dataloader:
  batch_size: 256
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: false
