  action_dim: 10
  dataset:
    _target_: hiera_diffusion_policy.dataset.robomimic_replay_dataset.RobomimicReplayDataset
    max_train_episodes: ${max_train_episodes}
    Tr: ${Tr}
    use_subgoal: ${use_subgoal}
    observation_history_num: ${observation_history_num}
    abs_action: true
    dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5
    use_image: ${use_image}
    image_keys:
    - agentview_image
    - robot0_eye_in_hand_image
    image_size:
    - 84
    - 84
    d3p_query_every: 4
    d3p_action_chunk_len: ${horizon}
    qpos_normalize: true
    horizon: ${horizon}
    obs_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    val_ratio: 0.02
  dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5
  dataset_type: ph
  env_runner:
    _target_: hiera_diffusion_policy.env_runner.robomimic_runner.RobomimicRunner
    abs_action: true
    crf: 22
    dataset_path: data/robomimic/datasets/can/ph/image_abs_pcd.hdf5
    fps: 10
    max_steps: 500
    use_subgoal: ${use_subgoal}
    use_pcd: ${use_pcd}
    image_keys:
    - agentview_image
    - robot0_eye_in_hand_image
    qpos_normalize: ${task.dataset.qpos_normalize}
    n_action_steps: ${n_action_steps}
    n_envs: 28
    n_latency_steps: 0
    observation_history_num: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    obs_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    past_action: false
    render_hw:
    - 128
    - 128
    test_start_seed: 100000
    train_start_idx: 0
    test_run: ${test_run}
  name: can_pcd
  obs_keys:
  - object
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
  task_name: can

training:
  checkpoint_every: 50
  debug: false
  visual_data: true
