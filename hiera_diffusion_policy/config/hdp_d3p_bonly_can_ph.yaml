_target_: hiera_diffusion_policy.workspace.train_workspace.TrainWorkspace

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 0
    mode: max
    monitor_key: test_mean_score

dataloader:
  batch_size: 256
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: true

dataloader_noshuff:
  batch_size: 256
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: false

guider_path:
critic_path:
actor_path:

train_model: actor

name_remark: d3p_bonly

logging:
  group: null
  id: null
  mode: online
  name: can_ph_d3p_bonly_seed${training.seed}_${name_remark}
  project: hiera_diffusion_policy
  resume: false

test_guider: false
test_run: false

max_train_episodes: null
use_subgoal: true
use_pcd: true
use_image: true
single_step_reverse_diffusion: true
eta: 0.0
subgoal_dim: 8
subgoal_dim_nocont: 6
extra_cond_dim: 64

n_action_steps: 4
horizon: 16
Tr: 8
n_latency_steps: 0
observation_history_num: 2
name: train_hdp_d3p_bonly

optimizer_guider:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-06

optimizer_critic:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.001
  weight_decay: 1.0e-06

optimizer_actor:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06

model_guider:
  _target_: hiera_diffusion_policy.model.diffusion.guider.Guider
  diffusion_step_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.positional_embedding.TimestepEncoder
    diffusion_step_embed_dim: 128
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
    - 256
  state_dim: 54
  subgoal_dim: ${subgoal_dim}
  mlp_dims:
  - 1024
  - 512
  - 256

model_actor:
  _target_: hiera_diffusion_policy.model.diffusion.actor_small.Actor
  diffusion_step_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.positional_embedding.TimestepEncoder
    diffusion_step_embed_dim: 128
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
  action_dim: 10
  down_dims:
  - 128
  - 256
  - 512
  state_dim: 54
  use_subgoal: ${use_subgoal}
  use_pcd: ${use_pcd}
  subgoal_dim: ${subgoal_dim}
  extra_cond_dim: ${extra_cond_dim}
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

model_critic:
  _target_: hiera_diffusion_policy.model.diffusion.critic.Critic2net
  pcd_encoder:
    _target_: hiera_diffusion_policy.model.diffusion.pointcloud_encoder.PointNetEncoder
    input_dim: 6
    mlp_dims:
    - 64
    - 128
    - 256
  state_dim: 54
  subgoal_dim: ${subgoal_dim}
  action_dim: 80
  mlp_dims:
  - 512
  - 256
  - 128

policy:
  _target_: hiera_diffusion_policy.policy.hiera_diffusion_policy_d3p_bonly.HieraDiffusionPolicyD3PBOnly
  fusion_debug_checks: true
  d3p_query_every: ${task.dataset.d3p_query_every}
  mode: SINGLE
  single_branch: B1
  b_branch: B1
  switch_prob_b: 0.5
  d3p_rollout_error_samples: 10
  extra_cond_dim: ${extra_cond_dim}
  image_feat_dim: 64
  qpos_feat_dim: 9
  koopman_latent_act_dim: ${extra_cond_dim}
  koopman_hidden_dim: 128
  koopman_num_hidden_layers: 4
  koopman_dropout: 0.0
  koopman_activation: ReLU
  koopman_use_spectral_norm: false
  koopman_use_norm: false
  koopman_norm_style: BatchNorm
  koopman_kvp_weight: 0.3
  koopman_fea_weight: 0.7
  koopman_use_augmentation: true
  koopman_aug_crop_pad: 0.10
  koopman_aug_rotate: 15.0
  koopman_aug_noise_scale: 0.02
  koopman_aug_brightness_min: 0.9
  koopman_aug_brightness_max: 1.1
  next_action_mode: dataset
  action_dim: 10
  horizon: ${horizon}
  subgoal_dim_nocont: ${subgoal_dim_nocont}
  subgoal_dim: ${subgoal_dim}
  n_action_steps: ${n_action_steps}
  observation_history_num: 2
  discount: 0.95
  eta: ${eta}
  use_pcd: ${use_pcd}
  single_step_reverse_diffusion: ${single_step_reverse_diffusion}
  Tr: ${Tr}
  ema:
    _target_: hiera_diffusion_policy.model.diffusion.ema_model_hdp.EMAModel
    inv_gamma: 1.0
    max_value: 0.9999
    min_value: 0.0
    power: 0.75
    update_after_step: 0
  noise_scheduler_guider:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_schedule: squaredcos_cap_v2
    beta_end: 0.02
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  noise_scheduler_actor:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_schedule: squaredcos_cap_v2
    beta_end: 0.02
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 10
    prediction_type: epsilon
    variance_type: fixed_small

task:
