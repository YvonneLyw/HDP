  max_val_steps: null
  num_epochs: 3000
  num_steps: 300000
  resume: false
  rollout_every: 50
  updateAction_every: 10
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1

